name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # weekly upstream-compat patrol: same checks, no code changes expected

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Release checks
        run: python scripts/release_check.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    needs: validate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build adapter packages
        run: python scripts/build_adapters.py --output dist
      - name: Package per-runtime archives
        run: |
          mkdir -p assets
          for runtime in openclaw hermesagent codex opencode claude-code generic; do
            (cd "dist/${runtime}" && zip -qr "../../assets/deep-research-${runtime}-${GITHUB_REF_NAME}.zip" deep-research)
          done
      - name: Publish release with assets (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tag re-pushes and mirror re-syncs re-trigger this job; reuse the
          # release if it already exists instead of failing on a duplicate.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" assets/*.zip --clobber
