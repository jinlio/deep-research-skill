name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # weekly upstream-compat patrol: same checks, no code changes expected

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Release checks
        run: python scripts/release_check.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build adapter packages
        run: python scripts/build_adapters.py --output dist
      - name: Package per-runtime archives
        run: |
          mkdir -p assets
          for runtime in openclaw hermesagent codex opencode claude-code generic; do
            (cd "dist/${runtime}" && zip -qr "../../assets/deep-research-${runtime}-${GITHUB_REF_NAME}.zip" deep-research)
          done
      - name: Create release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" assets/*.zip --clobber
